# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
    nodejs: "22"
  jobs:
    post_build:
      - make -C docs purge-css DOCS_BUILDDIR="$READTHEDOCS_OUTPUT/html/"

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/conf.py

# Also build a PDF, using Read the Docs' LaTeX toolchain
formats:
  - pdf
  - htmlzip

# Install the project with the `docs` extra so the `furo` theme is
# available during the docs build.
# See https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
