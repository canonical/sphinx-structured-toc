[project]
name = "sphinx-structured-toc"
description = "A Sphinx extension for rendering compact, semantic, accessible documentation link lists grouped by domain."
dynamic = ["version"]
requires-python = ">=3.10"
readme = { file = "README.rst", content-type = "text/x-rst" }
dependencies = [
    "docutils>=0.21.2",
    "sphinx~=7.0",
]
authors = [{ name = "Daniele Procida" }]
keywords = ["sphinx", "accessibility", "toc", "aria"]
classifiers = [
    "Framework :: Sphinx :: Extension",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation :: Sphinx",
]
license = { file = "LICENSE" }

[project.urls]
Documentation = "https://canonical-sphinx-structured-toc.readthedocs-hosted.com/"
Source = "https://github.com/canonical/sphinx-structured-toc"
Issues = "https://github.com/canonical/sphinx-structured-toc/issues"

[project.optional-dependencies]
docs = [
    "furo>=2024.1.29",
    "sphinxcontrib-svg2pdfconverter[CairoSVG]~=2.1",
]

[dependency-groups]
lint = [
    "mypy>=1.16.0",
]
types = [
    "types-docutils",
    "types-setuptools",
]
dev = [
    "bs4>=0.0.2",
    "build>=1.5.0",
    "furo>=2024.1.29",
    "lxml>=5.0",
    "pytest>=8.4.0",
    "pytest-cov~=6.0",
    "pytest-mock~=3.12",
    "sphinx-autobuild>=2024.10.3",
    "sphinxcontrib-svg2pdfconverter[CairoSVG]~=2.1",
    "twine>=6.2.0",
]

[build-system]
requires = ["setuptools>=69.0", "setuptools_scm[toml]>=7.1"]
build-backend = "setuptools.build_meta"



[tool.setuptools_scm]
write_to = "sphinx_structured_toc/_version.py"
version_scheme = "post-release"
git_describe_command = [
    "git",
    "describe",
    "--dirty",
    "--tags",
    "--long",
    "--match",
    "[0-9]*.[0-9]*.[0-9]*",
    "--exclude",
    "*[^0-9.]*",
]

[tool.setuptools.packages.find]
include = ["sphinx_structured_toc"]
namespaces = false

[tool.setuptools.package-data]
sphinx_structured_toc = ["*.css"]

[tool.codespell]
ignore-words-list = "buildd,crate,keyserver,comandos,ro,dedent,dedented"
skip = ".tox,.git,build,.*_cache,__pycache__,*.tar,*.snap,*.png,./node_modules,.direnv,.venv,venv,.vscode"
quiet-level = 3
check-filenames = true

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = "tests"
pythonpath = "tests"
xfail_strict = true
markers = ["slow: slow tests"]

[tool.coverage.run]
branch = true
omit = ["tests/**"]

[tool.coverage.report]
skip_empty = true
exclude_also = ["if (typing\\.)?TYPE_CHECKING:"]

[tool.pyright]
strict = ["sphinx_structured_toc"]
pythonVersion = "3.10"
pythonPlatform = "Linux"
exclude = [
    "**/.*",
    "**/__pycache__",
    "**/_version.py",
]

[tool.mypy]
python_version = "3.10"
exclude = ["build", "results"]
warn_unused_configs = true
warn_redundant_casts = true
strict_equality = true
extra_checks = true
warn_return_any = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["sphinx_structured_toc.*"]
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["tests.*"]
strict = false

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["sphinx_structured_toc", "tests"]
extend-exclude = ["*/_version.py"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "I",
    "N",
    "D",
    "UP",
    "YTT",
    "ANN",
    "ASYNC",
    "S101",
