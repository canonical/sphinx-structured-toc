[tool.ruff.lint.pydocstyle]
ignore-decorators = [
    "typing.overload",
    "overrides.override",
    "overrides.overrides",
    "typing.override",
    "typing_extensions.override",
]

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 16

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
    "D",
    "ANN",
    "ARG",
    "S101",
    "S103",
    "S108",
    "PLR0913",
    "PLR2004",
    "SLF",
]
"__init__.py" = [
    "I001",
    "F401",
]
"docs/conf.py" = [
    "INP001",
]
